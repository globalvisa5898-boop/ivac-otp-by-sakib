plugins {
    id 'com.android.application' version '8.2.2'
}

android {
    namespace 'com.ivac.otpsupport'
    compileSdk 34

    defaultConfig {
        applicationId "com.ivac.otpsupport"
        minSdk 23
        targetSdk 33
        versionCode 1
        versionName "1.3"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
